<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Exercícios DOM: O Crachá</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* O Objeto do Exercício: Um Crachá */
        #cracha-virtual {
            background-color: white;
            width: 300px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 10px solid #0056b3; /* Cor padrão */
        }

        .cabecalho-cracha {
            background-color: #f1f3f5;
            padding: 10px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #868e96;
            text-transform: uppercase;
        }

        #foto-participante {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-top: 20px;
            border: 5px solid #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        .info-container { padding: 20px; }
        
        h2.nome { margin: 10px 0 5px 0; color: #333; }
        p.empresa { color: #777; margin: 0; font-weight: 500; }

        #status-acesso {
            margin-top: 20px;
            padding: 8px;
            background-color: #ffec99; /* Amarelo (Pendente) */
            color: #856404;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Área de Controle (Simulando um sistema externo) */
        .painel-controle {
            margin-top: 40px;
            padding: 20px;
            border: 1px dashed #aaa;
            background: #fff;
            width: 300px;
        }
    </style>
</head>
<body>

    <div id="cracha-virtual">
        <div class="cabecalho-cracha">Tech Summit 2025</div>
        
        <img id="foto-participante" src="https://via.placeholder.com/150" alt="Foto">
        
        <div class="info-container">
            <h2 class="nome">Nome do Participante</h2>
            <p class="empresa">Empresa não informada</p>
            
            <div id="status-acesso">PENDENTE</div>
        </div>
    </div>

    <div class="painel-controle">
        <label>Alterar Empresa:</label><br>
        <input id="input-nova-empresa" type="text" value="Google Brasil">
    </div>

</body>

</html>
